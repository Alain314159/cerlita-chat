# RAM del entorno: 3.9 GB sin swap — compilación Kotlin IN-PROCESS (una sola JVM)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# (H22) sandbox: el JDK del sistema es JRE sin javac; apuntar al Temurin del toolchain
org.gradle.java.installations.paths=/home/z/toolchain/jdk-21
