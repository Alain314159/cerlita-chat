<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 · Cerlita</title>
<style>
  :root {
    --accent: #D87884;
    --bg: #E0C2C4;
    --panel: #FBEAEA;
    --text: #4A3D3F;
    --muted: #7A6167;
    --grid: #CCBABA;
    --tile-2: #F6D8D8; --tile-4: #F2C7CD; --tile-8: #EFAFBA;
    --tile-16: #EA98A8; --tile-32: #E18393; --tile-64: #D87884;
    --tile-128: #C96A85; --tile-256: #BA5C7D; --tile-512: #A94E74;
    --tile-1024: #98426B; --tile-2048: #873662;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    touch-action: none; user-select: none;
  }
  header {
    width: 100%; max-width: 420px; padding: 14px 16px 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .who { font-size: 12px; color: var(--muted); }
  h1 { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
  .scores { display: flex; gap: 8px; }
  .scorebox {
    background: var(--panel); border-radius: 10px; padding: 6px 14px; text-align: center;
    min-width: 72px;
  }
  .scorebox .label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .scorebox .value { font-size: 18px; font-weight: 800; }
  #record { width: 100%; max-width: 420px; padding: 0 16px 6px; font-size: 12px; color: var(--muted); }
  #board {
    position: relative; background: var(--grid); border-radius: 12px;
    width: min(92vw, 400px); height: min(92vw, 400px);
    display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr);
    gap: 8px; padding: 8px;
  }
  .cell { border-radius: 8px; background: rgba(0,0,0,0.07); }
  .tile {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-weight: 800; color: #fff;
    transition: left 90ms ease, top 90ms ease;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .tile.pop { animation: pop 140ms ease; }
  @keyframes pop { 0% { transform: scale(0.2); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #overlay {
    position: fixed; inset: 0; background: rgba(32,25,28,0.82);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #F6E4E7; text-align: center; padding: 24px; z-index: 10;
  }
  #overlay h2 { font-size: 26px; margin-bottom: 6px; }
  #overlay .final { font-size: 40px; font-weight: 800; color: var(--accent); margin: 10px 0 18px; }
  #overlay .sent { font-size: 13px; color: #D9C9CE; margin-top: 12px; min-height: 18px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 24px;
    padding: 12px 32px; font-size: 16px; font-weight: 700;
  }
  footer {
    margin-top: 10px; font-size: 11px; color: var(--muted);
    text-align: center; padding: 0 16px 12px; max-width: 420px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>2048</h1>
    <div class="who" id="who">para los dos 💗</div>
  </div>
  <div class="scores">
    <div class="scorebox"><div class="label">Puntos</div><div class="value" id="score">0</div></div>
    <div class="scorebox"><div class="label">Récord</div><div class="value" id="best">0</div></div>
  </div>
</header>
<div id="record">El récord de la pareja viaja cifrado, solo entre ustedes.</div>
<div id="board"></div>
<footer>Desliza para mover · llegó a 2048 y sigue 💗</footer>
<div id="overlay">
  <h2>¡Se acabó!</h2>
  <div>Puntuación</div>
  <div class="final" id="finalScore">0</div>
  <button id="again">Jugar otra vez</button>
  <div class="sent" id="sent"></div>
</div>

<script>
"use strict";
/* ── 2048 de Cerlita · J0/D111 — vanilla JS, sin red, puente opcional ──
   El puente (window.Cerlita) existe solo dentro de la app: theme(), player(),
   haptic(), submit(), close(). En un navegador normal todo degrada solo. */

var SIZE = 4;
var grid, score, best, over = false;
var board = document.getElementById("board");
var tiles = {}; // key "r,c" -> elemento

/* tema: el de la app si el puente existe */
try {
  if (window.Cerlita && window.Cerlita.theme) {
    var t = JSON.parse(window.Cerlita.theme());
    if (t.accent) document.documentElement.style.setProperty("--accent", t.accent);
    if (t.bg) document.documentElement.style.setProperty("--bg", t.bg);
    if (t.panel) document.documentElement.style.setProperty("--panel", t.panel);
    if (t.text) document.documentElement.style.setProperty("--text", t.text);
    if (t.muted) document.documentElement.style.setProperty("--muted", t.muted);
    if (t.grid) document.documentElement.style.setProperty("--grid", t.grid);
  }
} catch (e) {}

try {
  if (window.Cerlita && window.Cerlita.player) {
    var p = JSON.parse(window.Cerlita.player());
    if (p.name) document.getElementById("who").textContent = "jugando: " + p.name;
  }
} catch (e) {}

for (var c = 0; c < 16; c++) {
  var cell = document.createElement("div");
  cell.className = "cell";
  board.appendChild(cell);
}

best = 0;
try { best = parseInt(localStorage.getItem("cerlita2048best") || "0", 10) || 0; } catch (e) {}
document.getElementById("best").textContent = best;

function tileClass(v) {
  var cl = "tile";
  if (v >= 2048) cl += " t2048";
  return cl;
}
function tileColor(v) {
  var map = {2:"--tile-2",4:"--tile-4",8:"--tile-8",16:"--tile-16",32:"--tile-32",64:"--tile-64",
             128:"--tile-128",256:"--tile-256",512:"--tile-512",1024:"--tile-1024",2048:"--tile-2048"};
  var varName = v > 2048 ? "--tile-2048" : (map[v] || "--tile-2");
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#D87884";
}
function fontSize(v) {
  var n = String(v).length;
  return n <= 2 ? 34 : n === 3 ? 28 : n === 4 ? 22 : 18;
}
function metrics() {
  var rect = board.getBoundingClientRect();
  var pad = 8, gap = 8;
  var cellSize = (rect.width - pad * 2 - gap * 3) / 4;
  return { rect: rect, cell: cellSize, gap: gap, pad: pad };
}
function place(el, r, c, m) {
  el.style.width = m.cell + "px";
  el.style.height = m.cell + "px";
  el.style.left = (m.pad + c * (m.cell + m.gap)) + "px";
  el.style.top = (m.pad + r * (m.cell + m.gap)) + "px";
}
function addTile(r, c, v, animate) {
  var m = metrics();
  var el = document.createElement("div");
  el.className = tileClass(v) + (animate ? " pop" : "");
  el.textContent = v;
  el.style.background = tileColor(v);
  el.style.fontSize = fontSize(v) + "px";
  place(el, r, c, m);
  board.appendChild(el);
  tiles[r + "," + c] = el;
}
function moveEl(r, c, nr, nc) {
  var el = tiles[r + "," + c];
  if (!el) return;
  delete tiles[r + "," + c];
  tiles[nr + "," + nc] = el;
  var m = metrics();
  place(el, nr, nc, m);
}
function removeTile(r, c) {
  var el = tiles[r + "," + c];
  if (el) el.remove();
  delete tiles[r + "," + c];
}
function haptic(kind) {
  try { if (window.Cerlita && window.Cerlita.haptic) window.Cerlita.haptic(kind || "light"); } catch (e) {}
}

function newGame() {
  Object.keys(tiles).forEach(function (k) { removeTile(k.split(",")[0] | 0, k.split(",")[1] | 0); });
  grid = [];
  for (var r = 0; r < SIZE; r++) { grid.push([0, 0, 0, 0]); }
  score = 0; over = false;
  document.getElementById("score").textContent = "0";
  document.getElementById("overlay").style.display = "none";
  spawn(); spawn();
}
function emptyCells() {
  var out = [];
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++)
    if (grid[r][c] === 0) out.push([r, c]);
  return out;
}
function spawn() {
  var empties = emptyCells();
  if (!empties.length) return;
  var pick = empties[Math.floor(Math.random() * empties.length)];
  var v = Math.random() < 0.9 ? 2 : 4;
  grid[pick[0]][pick[1]] = v;
  addTile(pick[0], pick[1], v, true);
}
/* mueve una línea hacia dir; devuelve {moved, gained} */
function slideLine(line) {
  var vals = line.filter(function (v) { return v !== 0; });
  var out = [], gained = 0, i;
  for (i = 0; i < vals.length; i++) {
    if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
      out.push(vals[i] * 2); gained += vals[i] * 2; i++;
    } else out.push(vals[i]);
  }
  while (out.length < SIZE) out.push(0);
  return { line: out, gained: gained };
}
function move(dir) {
  if (over) return;
  var moved = false, gainedTotal = 0;
  var r, c, i, res;
  // dir: 0=izq 1=der 2=arriba 3=abajo
  for (i = 0; i < SIZE; i++) {
    var line = [];
    for (var j = 0; j < SIZE; j++) {
      if (dir === 0) line.push(grid[i][j]);
      else if (dir === 1) line.push(grid[i][SIZE - 1 - j]);
      else if (dir === 2) line.push(grid[j][i]);
      else line.push(grid[SIZE - 1 - j][i]);
    }
    res = slideLine(line);
    if (res.line.join(",") !== line.join(",")) moved = true;
    gainedTotal += res.gained;
    for (j = 0; j < SIZE; j++) {
      var v = res.line[j];
      if (dir === 0) grid[i][j] = v;
      else if (dir === 1) grid[i][SIZE - 1 - j] = v;
      else if (dir === 2) grid[j][i] = v;
      else grid[SIZE - 1 - j][i] = v;
    }
  }
  if (!moved) return;
  if (gainedTotal > 0) haptic("light");
  // re-render completo (simple y robusto)
  Object.keys(tiles).forEach(function (k) { removeTile(k.split(",")[0] | 0, k.split(",")[1] | 0); });
  for (r = 0; r < SIZE; r++) for (c = 0; c < SIZE; c++)
    if (grid[r][c] !== 0) addTile(r, c, grid[r][c], false);
  score += gainedTotal;
  document.getElementById("score").textContent = score;
  if (score > best) {
    best = score;
    document.getElementById("best").textContent = best;
    try { localStorage.setItem("cerlita2048best", String(best)); } catch (e) {}
  }
  spawn();
  if (emptyCells().length === 0 && !canMove()) endGame();
}
function canMove() {
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
    var v = grid[r][c];
    if (v === 0) return true;
    if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
    if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
  }
  return false;
}
function endGame() {
  over = true;
  haptic("heavy");
  document.getElementById("finalScore").textContent = score;
  document.getElementById("sent").textContent = "";
  document.getElementById("overlay").style.display = "flex";
  var sent = document.getElementById("sent");
  try {
    if (window.Cerlita && window.Cerlita.submit) {
      window.Cerlita.submit(score);
      sent.textContent = "Puntuación enviada al chat 💗";
    } else {
      sent.textContent = "";
    }
  } catch (e) { sent.textContent = ""; }
}

/* ── entrada: teclado + swipe ── */
document.addEventListener("keydown", function (e) {
  var map = { ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3 };
  if (map[e.key] !== undefined) { e.preventDefault(); move(map[e.key]); }
});
var tx = 0, ty = 0, tracking = false;
document.addEventListener("touchstart", function (e) {
  if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; tracking = true; }
}, { passive: true });
document.addEventListener("touchend", function (e) {
  if (!tracking) return;
  tracking = false;
  var dx = e.changedTouches[0].clientX - tx;
  var dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0);
  else move(dy > 0 ? 3 : 2);
}, { passive: true });
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

document.getElementById("again").addEventListener("click", function () {
  haptic("light");
  newGame();
});
window.addEventListener("resize", function () {
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
    var el = tiles[r + "," + c];
    if (el) place(el, r, c, metrics());
  }
});

/* récord de la pareja que trae el puente (si está) */
try {
  if (window.Cerlita && window.Cerlita.record) {
    var rec = JSON.parse(window.Cerlita.record());
    if (rec && rec.score > 0) {
      document.getElementById("record").textContent =
        "Récord de la pareja: " + rec.score + " · " + (rec.holder || "alguien especial");
    }
  }
} catch (e) {}

newGame();
</script>
</body>
</html>
